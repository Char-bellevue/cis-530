spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.server.webflux.routes[0].id=student-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://student-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/students/**
spring.cloud.gateway.server.webflux.routes[1].id=student-profile-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://student-profile-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/profiles/**
